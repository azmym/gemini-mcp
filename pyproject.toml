[project]
name = "gemini-mcp"
version = "0.3.0"
description = "MCP server exposing Google Gemini capabilities via Google AI Studio"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.2.0,<4",
    # Deep Research needs the Interactions API. The service rejects the legacy
    # interactions schema below 2.0.0 with "please upgrade your google-genai
    # Python SDK to version >= 2.0.0", so this floor is a runtime requirement.
    # 2.18.1 is also the floor verified against AI Studio Authorization keys
    # (the new "AQ."-prefixed format); older 2.x releases may predate them.
    "google-genai>=2.18.1",
]

[project.scripts]
gemini-mcp = "server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
