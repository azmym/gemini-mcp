[project]
name = "gemini-mcp"
version = "0.1.0"
description = "MCP server exposing Google Gemini capabilities via Google AI Studio"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "google-genai>=0.3.0",
]

[project.scripts]
gemini-mcp = "server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
